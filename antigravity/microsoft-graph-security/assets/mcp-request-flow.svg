<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>
  .bg{fill:#081525}.panel{fill:#10253d;stroke:#2d5d85;stroke-width:2}.panel2{fill:#0d1e31;stroke:#3b729f;stroke-width:2}.title{fill:#f4f8fc;font:700 40px Arial,sans-serif}.sub{fill:#b6cadb;font:400 21px Arial,sans-serif}.label{fill:#f4f8fc;font:700 23px Arial,sans-serif}.small{fill:#c8d8e6;font:400 18px Arial,sans-serif}.tiny{fill:#9bb5ca;font:400 15px Arial,sans-serif}.accent{fill:#47c7ff}.violet{fill:#9b7bff}.amber{fill:#ffbd59}.green{fill:#4dd4a8}.line{stroke:#6ccff6;stroke-width:4;fill:none}.dash{stroke:#8baac1;stroke-width:3;stroke-dasharray:10 8;fill:none}.arrow{fill:#6ccff6}.tag{fill:#183b59;stroke:#4f96c4;stroke-width:1.5}.guard{fill:#14293d;stroke:#ffbd59;stroke-width:3}.deny{fill:#362338;stroke:#ff8ea1;stroke-width:3}
</style><rect class="bg" width="1600" height="900"/>
<text class="title" x="70" y="70">Runtime Request Flow</text><text class="sub" x="70" y="105">A host normally connects only to the gateway; a backend may run standalone for debugging</text>
<g><rect class="panel" x="75" y="330" width="190" height="130" rx="16"/><text class="label" x="112" y="383">MCP host</text><text class="small" x="103" y="417">AI assistant</text></g>
<path class="line" d="M265 395H385"/><path class="arrow" d="M375 385h20l-10 16z"/><text class="tiny" x="285" y="375">MCP / stdio</text>
<g><rect class="panel2" x="395" y="300" width="255" height="190" rx="16"/><text class="label" x="450" y="350">gateway_mcp</text><text class="small" x="430" y="385">namespace tool</text><text class="small" x="425" y="420">resolve backend</text><text class="small" x="420" y="455">broker auth / proxy</text></g>
<path class="line" d="M650 395H770"/><path class="arrow" d="M760 385h20l-10 16z"/><text class="tiny" x="668" y="375">JSON-RPC forward</text>
<g><rect class="panel" x="780" y="300" width="260" height="190" rx="16"/><text class="label" x="830" y="350">Backend MCP</text><text class="small" x="816" y="385">schema validation</text><text class="small" x="816" y="420">guardrails + handler</text><text class="small" x="816" y="455">redaction + audit</text></g>
<path class="line" d="M1040 395H1160"/><path class="arrow" d="M1150 385h20l-10 16z"/><text class="tiny" x="1070" y="375">Graph call</text>
<g><rect class="panel" x="1170" y="330" width="300" height="130" rx="16"/><text class="label" x="1220" y="383">Microsoft Graph</text><text class="small" x="1230" y="417">+ Defender Endpoint</text></g>
<path class="dash" d="M910 490V640H1320"/><rect class="tag" x="1320" y="595" width="190" height="90" rx="14"/><text class="label" x="1350" y="635">Optional audit</text><text class="tiny" x="1350" y="662">redacted output</text>
<path class="dash" d="M520 490V640H300"/><rect class="tag" x="85" y="595" width="215" height="90" rx="14"/><text class="label" x="113" y="635">Stand-alone mode</text><text class="tiny" x="113" y="662">backend debugging</text>
<text class="small" x="450" y="790">Return path: Graph result → redact → optional audit → backend → gateway → MCP host</text>
