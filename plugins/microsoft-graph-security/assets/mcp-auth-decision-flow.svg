<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>
  .bg{fill:#081525}.panel{fill:#10253d;stroke:#2d5d85;stroke-width:2}.panel2{fill:#0d1e31;stroke:#3b729f;stroke-width:2}.title{fill:#f4f8fc;font:700 40px Arial,sans-serif}.sub{fill:#b6cadb;font:400 21px Arial,sans-serif}.label{fill:#f4f8fc;font:700 23px Arial,sans-serif}.small{fill:#c8d8e6;font:400 18px Arial,sans-serif}.tiny{fill:#9bb5ca;font:400 15px Arial,sans-serif}.accent{fill:#47c7ff}.violet{fill:#9b7bff}.amber{fill:#ffbd59}.green{fill:#4dd4a8}.line{stroke:#6ccff6;stroke-width:4;fill:none}.dash{stroke:#8baac1;stroke-width:3;stroke-dasharray:10 8;fill:none}.arrow{fill:#6ccff6}.tag{fill:#183b59;stroke:#4f96c4;stroke-width:1.5}.guard{fill:#14293d;stroke:#ffbd59;stroke-width:3}.deny{fill:#362338;stroke:#ff8ea1;stroke-width:3}
</style><rect class="bg" width="1600" height="900"/>
<text class="title" x="70" y="70">Authentication and Tenant-Safety Decision Flow</text><text class="sub" x="70" y="105">Settings resolve per profile; the default path is delegated interactive sign-in</text>
<rect class="panel" x="590" y="145" width="420" height="75" rx="16"/><text class="label" x="675" y="192">Load active profile</text><path class="line" d="M800 220v65"/><path class="arrow" d="M790 275h20l-10 16z"/>
<polygon class="panel2" points="800,285 950,365 800,445 650,365"/><text class="label" x="717" y="372">Tenant allowed?</text>
<path class="line" d="M650 365H405"/><path class="arrow" d="M395 355h20l-10 16z"/><text class="tiny" x="500" y="345">no</text><rect class="deny" x="95" y="320" width="300" height="90" rx="14"/><text class="label" x="150" y="360">Refuse to start</text><text class="small" x="123" y="390">fail-closed allowlist</text>
<path class="line" d="M800 445v55"/><path class="arrow" d="M790 490h20l-10 16z"/><text class="tiny" x="820" y="480">yes</text>
<polygon class="panel2" points="800,500 980,590 800,680 620,590"/><text class="label" x="708" y="598">Access mode?</text>
<path class="line" d="M620 590H360V720"/><path class="arrow" d="M350 710h20l-10 16z"/><text class="tiny" x="460" y="570">delegated</text><rect class="panel" x="135" y="720" width="300" height="105" rx="14"/><text class="label" x="180" y="760">Interactive</text><text class="small" x="162" y="792">browser, MFA / CA, wellknown client</text>
<path class="line" d="M800 680v40"/><path class="arrow" d="M790 710h20l-10 16z"/><rect class="panel" x="610" y="720" width="380" height="105" rx="14"/><text class="label" x="678" y="760">Device code</text><text class="small" x="650" y="792">headless fallback; tenant policy may block</text>
<path class="line" d="M980 590h250V720"/><path class="arrow" d="M1220 710h20l-10 16z"/><text class="tiny" x="1060" y="570">app_only</text><rect class="panel" x="1075" y="720" width="380" height="105" rx="14"/><text class="label" x="1150" y="760">App-only</text><text class="small" x="1115" y="792">certificate / keyring + admin consent</text>
</svg>