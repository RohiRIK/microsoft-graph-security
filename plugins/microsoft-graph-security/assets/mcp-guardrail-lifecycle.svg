<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>
  .bg{fill:#081525}.panel{fill:#10253d;stroke:#2d5d85;stroke-width:2}.panel2{fill:#0d1e31;stroke:#3b729f;stroke-width:2}.title{fill:#f4f8fc;font:700 40px Arial,sans-serif}.sub{fill:#b6cadb;font:400 21px Arial,sans-serif}.label{fill:#f4f8fc;font:700 23px Arial,sans-serif}.small{fill:#c8d8e6;font:400 18px Arial,sans-serif}.tiny{fill:#9bb5ca;font:400 15px Arial,sans-serif}.accent{fill:#47c7ff}.violet{fill:#9b7bff}.amber{fill:#ffbd59}.green{fill:#4dd4a8}.line{stroke:#6ccff6;stroke-width:4;fill:none}.dash{stroke:#8baac1;stroke-width:3;stroke-dasharray:10 8;fill:none}.arrow{fill:#6ccff6}.tag{fill:#183b59;stroke:#4f96c4;stroke-width:1.5}.guard{fill:#14293d;stroke:#ffbd59;stroke-width:3}.deny{fill:#362338;stroke:#ff8ea1;stroke-width:3}
</style><rect class="bg" width="1600" height="900"/>
<text class="title" x="70" y="70">Tool Guardrail and Response Lifecycle</text><text class="sub" x="70" y="105">Every registered tool must be classified, wrapped, cataloged, and redacted</text>
<g><rect class="panel" x="70" y="365" width="180" height="100" rx="14"/><text class="label" x="105" y="425">Request</text></g><path class="line" d="M250 415h75"/><path class="arrow" d="M315 405h20l-10 16z"/>
<g><rect class="panel" x="335" y="365" width="200" height="100" rx="14"/><text class="label" x="370" y="408">Schema</text><text class="small" x="355" y="438">validate</text></g><path class="line" d="M535 415h75"/><path class="arrow" d="M600 405h20l-10 16z"/>
<g><rect class="guard" x="620" y="335" width="270" height="160" rx="14"/><text class="label" x="670" y="380">withGuardrail()</text><text class="small" x="652" y="415">risk classification</text><text class="small" x="652" y="445">HITL + rate limit</text></g><path class="line" d="M890 415h75"/><path class="arrow" d="M955 405h20l-10 16z"/>
<g><rect class="panel" x="975" y="365" width="200" height="100" rx="14"/><text class="label" x="1022" y="408">Handler</text><text class="small" x="1003" y="438">Graph / local</text></g><path class="line" d="M1175 415h75"/><path class="arrow" d="M1240 405h20l-10 16z"/>
<g><rect class="panel" x="1260" y="365" width="220" height="100" rx="14"/><text class="label" x="1296" y="408">Response</text><text class="small" x="1292" y="438">redact + return</text></g>
<path class="dash" d="M755 495v135H1040"/><rect class="tag" x="1040" y="585" width="250" height="90" rx="14"/><text class="label" x="1084" y="625">Optional audit</text><text class="small" x="1070" y="653">redacted JSONL / SQLite</text>
<path class="dash" d="M755 335V250H380"/><rect class="deny" x="115" y="205" width="265" height="90" rx="14"/><text class="label" x="158" y="245">Write request</text><text class="small" x="142" y="273">needs opt-in + confirm</text>
<path class="dash" d="M755 335V250H1050"/><rect class="deny" x="1050" y="205" width="350" height="90" rx="14"/><text class="label" x="1095" y="245">Unclassified tool</text><text class="small" x="1080" y="273">startup refuses to boot</text>
<text class="tiny" x="625" y="760">Risk levels: read_public → read_sensitive → write_standard → write_destructive → write_critical</text>
</svg>